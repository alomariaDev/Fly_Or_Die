<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly or Die · El bosque tranquilo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      background: #10251c; font-family: "Courier New", monospace; overflow: hidden;
    }
    .cabinet {
      width: min(94vw, 540px, calc((100dvh - 72px) * .75));
    }
    canvas {
      display: block; width: 100%; height: auto; image-rendering: pixelated;
      border: 5px solid #d8bd67; box-shadow: 0 0 0 5px #315642, 0 0 35px #8fcf8a;
      background: #9ed6dc; touch-action: none; cursor: pointer;
    }
    .hint { margin: 16px 0 0; text-align: center; color: #b8d9ad; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 480px), (max-height: 520px) {
      .cabinet { width: min(94vw, calc((100dvh - 62px) * .75)); }
      .hint { margin-top: 12px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Juego Fly or Die, nivel El bosque tranquilo">
    <canvas id="game" width="480" height="640" aria-label="Fly or Die. Usa espacio para jugar."></canvas>
    <p class="hint">[ ESPACIO O TOCA LA PANTALLA ] IMPULSO</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const groundH = 54;
      const player = { x: 112, y: H / 2, size: 23, velocity: 0 };
      const physics = { gravity: 0.29, flap: -5.45, speed: 1.9 };
      const level = { name: 'EL BOSQUE TRANQUILO', goal: 10, minGap: 188, maxGap: 202 };
      let obstacles = [], score = 0, frame = 0, state = 'start', best = 0, musicStarted = false;

      try { best = Number(localStorage.getItem('skyJumperBest')) || 0; } catch (_) {}

      function reset() {
        player.y = H / 2 - 30;
        player.velocity = 0;
        obstacles = [];
        score = 0;
        frame = 0;
        state = 'playing';
      }

      function jump() {
        if (state !== 'playing') { reset(); }
        startForestMusic();
        player.velocity = physics.flap;
      }

      function addObstacle() {
        // A wide, almost constant opening makes this first lesson forgiving.
        const gap = level.minGap + Math.random() * (level.maxGap - level.minGap);
        const minTop = 72;
        const maxTop = H - groundH - gap - 60;
        const top = minTop + Math.random() * (maxTop - minTop);
        obstacles.push({ x: W + 20, width: 56, top, gap, branch: { collected: false } });
      }

      function gameOver() {
        state = 'gameover';
        if (score > best) {
          best = score;
          try { localStorage.setItem('skyJumperBest', best); } catch (_) {}
        }
      }

      // A small, gentle two-note loop; it starts only after a player gesture.
      function startForestMusic() {
        if (musicStarted) return;
        musicStarted = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audio = new AudioContext();
        const notes = [261.63, 329.63, 392, 329.63];
        let note = 0;
        setInterval(() => {
          if (state !== 'playing') return;
          const osc = audio.createOscillator(), gain = audio.createGain();
          osc.type = 'sine'; osc.frequency.value = notes[note++ % notes.length];
          gain.gain.setValueAtTime(.025, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .55);
          osc.connect(gain).connect(audio.destination);
          osc.start(); osc.stop(audio.currentTime + .58);
        }, 700);
      }

      function update() {
        if (state !== 'playing') return;
        frame++;
        player.velocity += physics.gravity;
        player.y += player.velocity;
        if (frame % 112 === 0) addObstacle();

        const px = player.x, py = player.y, ps = player.size;
        if (py < 0 || py + ps > H - groundH) gameOver();
        for (const o of obstacles) {
          o.x -= physics.speed;
          const overlapX = px + ps > o.x && px < o.x + o.width;
          const inColumn = py < o.top || py + ps > o.top + o.gap;
          if (overlapX && inColumn) gameOver();
          const bx = o.x + o.width / 2, by = o.top + o.gap / 2;
          const reachesBranch = !o.branch.collected && px + ps > bx - 15 && px < bx + 15 && py + ps > by - 11 && py < by + 11;
          if (reachesBranch) {
            o.branch.collected = true;
            score++;
            if (score >= level.goal) gameOver(true);
          }
        }
        obstacles = obstacles.filter(o => o.x + o.width > -10);
      }

      function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
      function text(value, x, y, size, color = '#fff', align = 'left') {
        ctx.fillStyle = color; ctx.font = `bold ${size}px "Courier New", monospace`;
        ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(value, x, y);
      }

      function drawBackground() {
        rect(0, 0, W, H, '#9ed6dc');
        rect(0, 300, W, H - 300, '#76b876');
        // Soft layers of trees keep the forest calm and readable.
        for (let x = -20; x < W + 30; x += 54) {
          const h = 92 + ((x * 13) % 54);
          rect(x + 20, H - groundH - h, 12, h, '#547c4b');
          rect(x, H - groundH - h + 18, 52, 35, '#4e9358');
          rect(x + 8, H - groundH - h, 37, 34, '#5ca963');
        }
      }

      function drawColumn(o) {
        const bottomY = o.top + o.gap;
        rect(o.x, 0, o.width, o.top, '#5a9d52');
        rect(o.x + 6, 0, 9, o.top, '#8acb70');
        rect(o.x + o.width - 7, 0, 7, o.top, '#397340');
        rect(o.x - 5, o.top - 15, o.width + 10, 15, '#b6da6a');
        rect(o.x, bottomY, o.width, H - groundH - bottomY, '#5a9d52');
        rect(o.x + 6, bottomY, 9, H - groundH - bottomY, '#8acb70');
        rect(o.x + o.width - 7, bottomY, 7, H - groundH - bottomY, '#397340');
        rect(o.x - 5, bottomY, o.width + 10, 15, '#b6da6a');
        if (!o.branch.collected) drawBranch(o.x + o.width / 2, o.top + o.gap / 2);
      }

      function drawBranch(x, y) {
        rect(x - 14, y - 2, 28, 5, '#75492d');
        rect(x - 6, y - 8, 5, 13, '#75492d');
        rect(x + 5, y - 5, 5, 10, '#75492d');
        rect(x - 10, y - 8, 7, 5, '#9dcb55');
        rect(x + 5, y - 9, 8, 5, '#9dcb55');
      }

      function drawPlayer() {
        const x = player.x, y = player.y;
        // Tiny flame trail reinforces the upward motion.
        if (state === 'playing' && player.velocity < -1) {
          rect(x - 7, y + 10, 7, 5, '#ffbc4a'); rect(x - 11, y + 11, 5, 3, '#f45b69');
        }
        rect(x, y, player.size, player.size, '#f3c85b');
        rect(x + 3, y + 3, player.size - 6, player.size - 6, '#e99645');
        rect(x + 14, y + 6, 5, 5, '#172b2c');
        rect(x + 16, y + 6, 2, 2, '#ffffff');
        rect(x + 4, y + player.size, 5, 4, '#f6e35b');
      }

      function drawGround() {
        rect(0, H - groundH, W, groundH, '#3c7042');
        rect(0, H - groundH, W, 8, '#b4d568');
        for (let x = -((frame * 2) % 24); x < W; x += 24) {
          rect(x, H - 31, 13, 5, '#5e914d'); rect(x + 5, H - 17, 13, 5, '#5e914d');
        }
      }

      function panel(title, lines) {
        rect(35, 206, W - 70, 168, '#173d31');
        ctx.strokeStyle = '#b4d568'; ctx.lineWidth = 4; ctx.strokeRect(37, 208, W - 74, 164);
        text(title, W / 2, 252, 24, '#f2d477', 'center');
        lines.forEach((line, i) => text(line, W / 2, 298 + i * 28, 15, '#ffffff', 'center'));
      }

      function draw() {
        drawBackground();
        obstacles.forEach(drawColumn);
        drawGround();
        drawPlayer();
        text('NIVEL 1 · BOSQUE', 18, 29, 16, '#285340');
        text(`RAMITAS ${score}/${level.goal}`, W - 18, 30, 17, '#285340', 'right');
        if (state === 'start') panel('EL BOSQUE TRANQUILO', ['RECOGE LAS RAMITAS', 'EN EL CENTRO DEL HUECO']);
        if (state === 'gameover') panel(score >= level.goal ? '¡NIVEL SUPERADO!' : 'INTÉNTALO DE NUEVO', [score >= level.goal ? '¡10 RAMITAS RECOGIDAS!' : `RAMITAS: ${score}/${level.goal}`, 'PRESIONA PARA JUGAR']);
      }

      function loop() { update(); draw(); requestAnimationFrame(loop); }
      window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); jump(); }
        else if (state === 'gameover') jump();
      });
      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        jump();
      });
      loop();
    })();
  </script>
</body>
</html>
