<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Jumper</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      background: #090b1a; font-family: "Courier New", monospace; overflow: hidden;
    }
    .cabinet {
      width: min(94vw, 540px, calc((100dvh - 72px) * .75));
    }
    canvas {
      display: block; width: 100%; height: auto; image-rendering: pixelated;
      border: 5px solid #f6e35b; box-shadow: 0 0 0 5px #252c68, 0 0 35px #63f7d2;
      background: #15193a; touch-action: none; cursor: pointer;
    }
    .hint { margin: 16px 0 0; text-align: center; color: #9fa8df; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 480px), (max-height: 520px) {
      .cabinet { width: min(94vw, calc((100dvh - 62px) * .75)); }
      .hint { margin-top: 12px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Juego Sky Jumper">
    <canvas id="game" width="480" height="640" aria-label="Sky Jumper. Usa espacio para jugar."></canvas>
    <p class="hint">[ ESPACIO O TOCA LA PANTALLA ] IMPULSO</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const groundH = 54;
      const player = { x: 112, y: H / 2, size: 23, velocity: 0 };
      const physics = { gravity: 0.32, flap: -5.65, speed: 2.25 };
      let obstacles = [], score = 0, frame = 0, state = 'start', best = 0;

      try { best = Number(localStorage.getItem('skyJumperBest')) || 0; } catch (_) {}

      function reset() {
        player.y = H / 2 - 30;
        player.velocity = 0;
        obstacles = [];
        score = 0;
        frame = 0;
        state = 'playing';
      }

      function jump() {
        if (state !== 'playing') { reset(); }
        player.velocity = physics.flap;
      }

      function addObstacle() {
        const gap = Math.max(142, 178 - Math.min(score * 2, 28));
        const minTop = 72;
        const maxTop = H - groundH - gap - 60;
        obstacles.push({ x: W + 20, width: 56, top: minTop + Math.random() * (maxTop - minTop), gap, counted: false });
      }

      function gameOver() {
        state = 'gameover';
        if (score > best) {
          best = score;
          try { localStorage.setItem('skyJumperBest', best); } catch (_) {}
        }
      }

      function update() {
        if (state !== 'playing') return;
        frame++;
        player.velocity += physics.gravity;
        player.y += player.velocity;
        if (frame % 92 === 0) addObstacle();

        const px = player.x, py = player.y, ps = player.size;
        if (py < 0 || py + ps > H - groundH) gameOver();
        for (const o of obstacles) {
          o.x -= physics.speed + Math.min(score * 0.018, .6);
          if (!o.counted && o.x + o.width < px) { o.counted = true; score++; }
          const overlapX = px + ps > o.x && px < o.x + o.width;
          const inColumn = py < o.top || py + ps > o.top + o.gap;
          if (overlapX && inColumn) gameOver();
        }
        obstacles = obstacles.filter(o => o.x + o.width > -10);
      }

      function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
      function text(value, x, y, size, color = '#fff', align = 'left') {
        ctx.fillStyle = color; ctx.font = `bold ${size}px "Courier New", monospace`;
        ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(value, x, y);
      }

      function drawBackground() {
        rect(0, 0, W, H, '#15193a');
        // Pixel stars and a distant skyline.
        const stars = [[28,72],[76,136],[145,55],[212,98],[270,42],[333,146],[411,78],[453,188],[46,282],[188,205],[302,264],[432,310]];
        for (const [x, y] of stars) { rect(x, y, 3, 3, '#8f9eea'); if ((x + y) % 2 === 0) rect(x + 3, y + 3, 2, 2, '#5963aa'); }
        rect(0, H - groundH - 48, W, 48, '#1e2555');
        for (let x = 0; x < W; x += 31) {
          const h = 15 + ((x * 7) % 33);
          rect(x, H - groundH - h, 23, h, '#272f67');
          rect(x + 5, H - groundH - h + 8, 4, 5, '#515aa2');
        }
      }

      function drawColumn(o) {
        const bottomY = o.top + o.gap;
        rect(o.x, 0, o.width, o.top, '#eb4b8c');
        rect(o.x + 6, 0, 9, o.top, '#ff8cbd');
        rect(o.x + o.width - 7, 0, 7, o.top, '#9f245c');
        rect(o.x - 5, o.top - 15, o.width + 10, 15, '#ffcc55');
        rect(o.x, bottomY, o.width, H - groundH - bottomY, '#eb4b8c');
        rect(o.x + 6, bottomY, 9, H - groundH - bottomY, '#ff8cbd');
        rect(o.x + o.width - 7, bottomY, 7, H - groundH - bottomY, '#9f245c');
        rect(o.x - 5, bottomY, o.width + 10, 15, '#ffcc55');
      }

      function drawPlayer() {
        const x = player.x, y = player.y;
        // Tiny flame trail reinforces the upward motion.
        if (state === 'playing' && player.velocity < -1) {
          rect(x - 7, y + 10, 7, 5, '#ffbc4a'); rect(x - 11, y + 11, 5, 3, '#f45b69');
        }
        rect(x, y, player.size, player.size, '#63f7d2');
        rect(x + 3, y + 3, player.size - 6, player.size - 6, '#2bb9b8');
        rect(x + 14, y + 6, 5, 5, '#10142d');
        rect(x + 16, y + 6, 2, 2, '#ffffff');
        rect(x + 4, y + player.size, 5, 4, '#f6e35b');
      }

      function drawGround() {
        rect(0, H - groundH, W, groundH, '#0e1130');
        rect(0, H - groundH, W, 8, '#f6e35b');
        for (let x = -((frame * 2) % 24); x < W; x += 24) {
          rect(x, H - 31, 13, 5, '#343e82'); rect(x + 5, H - 17, 13, 5, '#343e82');
        }
      }

      function panel(title, lines) {
        rect(35, 206, W - 70, 168, '#090b1a');
        ctx.strokeStyle = '#63f7d2'; ctx.lineWidth = 4; ctx.strokeRect(37, 208, W - 74, 164);
        text(title, W / 2, 252, 28, '#f6e35b', 'center');
        lines.forEach((line, i) => text(line, W / 2, 298 + i * 28, 15, '#ffffff', 'center'));
      }

      function draw() {
        drawBackground();
        obstacles.forEach(drawColumn);
        drawGround();
        drawPlayer();
        text('SKY JUMPER', 18, 29, 18, '#63f7d2');
        text(String(score).padStart(2, '0'), W - 18, 30, 25, '#f6e35b', 'right');
        if (state === 'start') panel('SKY JUMPER', ['PRESIONA ESPACIO', 'PARA COMENZAR']);
        if (state === 'gameover') panel('GAME OVER', [`PUNTAJE: ${score}`, `RÉCORD: ${best}`, 'PRESIONA UNA TECLA']);
      }

      function loop() { update(); draw(); requestAnimationFrame(loop); }
      window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); jump(); }
        else if (state === 'gameover') jump();
      });
      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        jump();
      });
      loop();
    })();
  </script>
</body>
</html>
