<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly or Die · La tormenta</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      background: #10251c; font-family: "Courier New", monospace; overflow: hidden;
    }
    .cabinet {
      width: min(94vw, 540px, calc((100dvh - 72px) * .75));
    }
    canvas {
      display: block; width: 100%; height: auto; image-rendering: pixelated;
      border: 5px solid #d8bd67; box-shadow: 0 0 0 5px #315642, 0 0 35px #8fcf8a;
      background: #9ed6dc; touch-action: none; cursor: pointer;
    }
    .hint { margin: 16px 0 0; text-align: center; color: #b8d9ad; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 480px), (max-height: 520px) {
      .cabinet { width: min(94vw, calc((100dvh - 62px) * .75)); }
      .hint { margin-top: 12px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Juego Fly or Die, niveles El bosque tranquilo y La tormenta">
    <canvas id="game" width="480" height="640" aria-label="Fly or Die. Usa espacio para jugar."></canvas>
    <p class="hint">[ ESPACIO O TOCA LA PANTALLA ] IMPULSO</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const groundH = 54;
      const player = { x: 112, y: H / 2, size: 23, velocity: 0 };
      const physics = { gravity: 0.29, flap: -5.45, speed: 1.9 };
      const levels = [
        { name: 'EL BOSQUE TRANQUILO', short: 'BOSQUE', goal: 10, minGap: 188, maxGap: 202, speed: 1.9, storm: false },
        { name: 'LA TORMENTA', short: 'TORMENTA', goal: 20, minGap: 172, maxGap: 190, speed: 2.08, storm: true }
      ];
      const wind = { active: false, force: 0, endsAt: 0, nextAt: 420, direction: 0 };
      let obstacles = [], leaves = [], score = 0, frame = 0, state = 'start', best = 0, musicStarted = false;

      try { best = Number(localStorage.getItem('skyJumperBest')) || 0; } catch (_) {}

      function reset() {
        player.y = H / 2 - 30;
        player.velocity = 0;
        obstacles = [];
        leaves = [];
        score = 0;
        frame = 0;
        wind.active = false;
        wind.force = 0;
        wind.endsAt = 0;
        wind.nextAt = 420;
        wind.direction = 0;
        state = 'playing';
      }

      function jump() {
        if (state !== 'playing') { reset(); }
        startForestMusic();
        player.velocity = physics.flap;
      }

      function addObstacle() {
        const level = currentLevel();
        // A wide, almost constant opening makes this first lesson forgiving.
        const gap = level.minGap + Math.random() * (level.maxGap - level.minGap);
        const minTop = 72;
        const maxTop = H - groundH - gap - 60;
        const top = minTop + Math.random() * (maxTop - minTop);
        const branchOffset = level.storm ? (Math.random() < .5 ? -1 : 1) * (18 + Math.random() * 20) : 0;
        obstacles.push({
          x: W + 20,
          width: 56,
          top,
          baseTop: top,
          gap,
          swaySeed: Math.random() * Math.PI * 2,
          branch: { collected: false, offset: branchOffset }
        });
      }

      function gameOver() {
        state = 'gameover';
        if (score > best) {
          best = score;
          try { localStorage.setItem('skyJumperBest', best); } catch (_) {}
        }
      }

      // A small, gentle two-note loop; it starts only after a player gesture.
      function startForestMusic() {
        if (musicStarted) return;
        musicStarted = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audio = new AudioContext();
        const notes = [261.63, 329.63, 392, 329.63];
        let note = 0;
        setInterval(() => {
          if (state !== 'playing') return;
          const osc = audio.createOscillator(), gain = audio.createGain();
          osc.type = 'sine'; osc.frequency.value = notes[note++ % notes.length];
          gain.gain.setValueAtTime(.025, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .55);
          osc.connect(gain).connect(audio.destination);
          osc.start(); osc.stop(audio.currentTime + .58);
        }, 700);
      }

      function currentLevel() {
        return score >= levels[0].goal ? levels[1] : levels[0];
      }

      function updateWind(level) {
        if (!level.storm) {
          wind.active = false;
          wind.force = 0;
          leaves = [];
          return;
        }
        if (!wind.active && frame >= wind.nextAt) {
          wind.active = true;
          wind.direction = Math.random() < .5 ? -1 : 1;
          wind.force = wind.direction * (0.075 + Math.random() * 0.035);
          wind.endsAt = frame + 118;
        }
        if (wind.active && frame >= wind.endsAt) {
          wind.active = false;
          wind.force = 0;
          wind.nextAt = frame + 150 + Math.floor(Math.random() * 115);
        }
        if (wind.active && frame % 5 === 0) {
          leaves.push({
            x: W + 12,
            y: 74 + Math.random() * (H - groundH - 120),
            vx: -2.7 - Math.random() * 1.5,
            vy: wind.direction * (1 + Math.random() * 1.4),
            size: 4 + Math.random() * 4,
            spin: Math.random() * 8
          });
        }
        for (const leaf of leaves) {
          leaf.x += leaf.vx;
          leaf.y += leaf.vy + Math.sin((frame + leaf.spin) * .18) * .45;
        }
        leaves = leaves.filter(leaf => leaf.x > -18 && leaf.y > 28 && leaf.y < H - groundH + 12);
      }

      function update() {
        if (state !== 'playing') return;
        frame++;
        const level = currentLevel();
        updateWind(level);
        player.velocity += physics.gravity;
        if (level.storm && wind.active) player.velocity += wind.force;
        player.y += player.velocity;
        if (frame % 112 === 0) addObstacle();

        const px = player.x, py = player.y, ps = player.size;
        if (py < 0 || py + ps > H - groundH) gameOver();
        for (const o of obstacles) {
          o.x -= level.speed;
          if (level.storm) o.top = o.baseTop + Math.sin(frame * .035 + o.swaySeed) * 9;
          const overlapX = px + ps > o.x && px < o.x + o.width;
          const inColumn = py < o.top || py + ps > o.top + o.gap;
          if (overlapX && inColumn) gameOver();
          const bx = o.x + o.width / 2, by = o.top + o.gap / 2 + o.branch.offset;
          const reachesBranch = !o.branch.collected && px + ps > bx - 15 && px < bx + 15 && py + ps > by - 11 && py < by + 11;
          if (reachesBranch) {
            o.branch.collected = true;
            score++;
            if (score >= levels[1].goal) gameOver(true);
          }
        }
        obstacles = obstacles.filter(o => o.x + o.width > -10);
      }

      function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
      function text(value, x, y, size, color = '#fff', align = 'left') {
        ctx.fillStyle = color; ctx.font = `bold ${size}px "Courier New", monospace`;
        ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(value, x, y);
      }

      function drawBackground() {
        const level = currentLevel();
        if (level.storm) {
          rect(0, 0, W, H, '#526b83');
          rect(0, 240, W, H - 240, '#4f7664');
          for (let y = 18; y < H - groundH; y += 31) {
            for (let x = -((frame * 4 + y) % 86); x < W; x += 86) rect(x, y, 22, 3, '#b9ccd1');
          }
        } else {
          rect(0, 0, W, H, '#9ed6dc');
          rect(0, 300, W, H - 300, '#76b876');
        }
        // Soft layers of trees keep the forest calm and readable.
        for (let x = -20; x < W + 30; x += 54) {
          const h = 92 + ((x * 13) % 54);
          rect(x + 20, H - groundH - h, 12, h, level.storm ? '#3f5a4d' : '#547c4b');
          rect(x, H - groundH - h + 18, 52, 35, level.storm ? '#456f57' : '#4e9358');
          rect(x + 8, H - groundH - h, 37, 34, level.storm ? '#537f63' : '#5ca963');
        }
      }

      function drawColumn(o) {
        const bottomY = o.top + o.gap;
        rect(o.x, 0, o.width, o.top, '#5a9d52');
        rect(o.x + 6, 0, 9, o.top, '#8acb70');
        rect(o.x + o.width - 7, 0, 7, o.top, '#397340');
        rect(o.x - 5, o.top - 15, o.width + 10, 15, '#b6da6a');
        rect(o.x, bottomY, o.width, H - groundH - bottomY, '#5a9d52');
        rect(o.x + 6, bottomY, 9, H - groundH - bottomY, '#8acb70');
        rect(o.x + o.width - 7, bottomY, 7, H - groundH - bottomY, '#397340');
        rect(o.x - 5, bottomY, o.width + 10, 15, '#b6da6a');
        if (!o.branch.collected) drawBranch(o.x + o.width / 2, o.top + o.gap / 2 + o.branch.offset);
      }

      function drawBranch(x, y) {
        rect(x - 14, y - 2, 28, 5, '#75492d');
        rect(x - 6, y - 8, 5, 13, '#75492d');
        rect(x + 5, y - 5, 5, 10, '#75492d');
        rect(x - 10, y - 8, 7, 5, '#9dcb55');
        rect(x + 5, y - 9, 8, 5, '#9dcb55');
      }

      function drawPlayer() {
        const x = player.x, y = player.y;
        // Tiny flame trail reinforces the upward motion.
        if (state === 'playing' && player.velocity < -1) {
          rect(x - 7, y + 10, 7, 5, '#ffbc4a'); rect(x - 11, y + 11, 5, 3, '#f45b69');
        }
        rect(x, y, player.size, player.size, '#f3c85b');
        rect(x + 3, y + 3, player.size - 6, player.size - 6, '#e99645');
        rect(x + 14, y + 6, 5, 5, '#172b2c');
        rect(x + 16, y + 6, 2, 2, '#ffffff');
        rect(x + 4, y + player.size, 5, 4, '#f6e35b');
      }

      function drawGround() {
        const level = currentLevel();
        rect(0, H - groundH, W, groundH, level.storm ? '#2f5748' : '#3c7042');
        rect(0, H - groundH, W, 8, level.storm ? '#8fbf7a' : '#b4d568');
        for (let x = -((frame * 2) % 24); x < W; x += 24) {
          rect(x, H - 31, 13, 5, level.storm ? '#496f50' : '#5e914d'); rect(x + 5, H - 17, 13, 5, level.storm ? '#496f50' : '#5e914d');
        }
      }

      function drawLeaves() {
        for (const leaf of leaves) {
          rect(leaf.x, leaf.y, leaf.size + 3, 3, '#d3aa4d');
          rect(leaf.x + 2, leaf.y - 2, leaf.size, 2, '#8daa53');
        }
      }

      function drawWindSignal() {
        const level = currentLevel();
        if (!level.storm || !wind.active) return;
        const y = wind.direction < 0 ? 84 : 126;
        const label = wind.direction < 0 ? 'VIENTO SUBE' : 'VIENTO BAJA';
        rect(W - 164, y - 18, 146, 34, '#223747');
        text(label, W - 91, y, 13, '#f2d477', 'center');
        const arrowY = y + (wind.direction < 0 ? -8 : 8);
        rect(W - 34, arrowY - 8, 5, 16, '#f2d477');
        rect(W - 39, arrowY + (wind.direction < 0 ? -10 : 6), 15, 5, '#f2d477');
      }

      function panel(title, lines) {
        rect(35, 206, W - 70, 168, '#173d31');
        ctx.strokeStyle = '#b4d568'; ctx.lineWidth = 4; ctx.strokeRect(37, 208, W - 74, 164);
        text(title, W / 2, 252, 24, '#f2d477', 'center');
        lines.forEach((line, i) => text(line, W / 2, 298 + i * 28, 15, '#ffffff', 'center'));
      }

      function draw() {
        drawBackground();
        drawLeaves();
        obstacles.forEach(drawColumn);
        drawGround();
        drawPlayer();
        drawWindSignal();
        const level = currentLevel();
        const hudColor = level.storm ? '#edf4d7' : '#285340';
        text(`NIVEL ${level.storm ? '2' : '1'} · ${level.short}`, 18, 29, 16, hudColor);
        text(`RAMITAS ${score}/${levels[1].goal}`, W - 18, 30, 17, hudColor, 'right');
        if (state === 'start') panel('EL BOSQUE TRANQUILO', ['RECOGE LAS RAMITAS', 'EN EL CENTRO DEL HUECO']);
        if (state === 'gameover') panel(score >= levels[1].goal ? '¡JUEGO SUPERADO!' : 'INTÉNTALO DE NUEVO', [score >= levels[1].goal ? '¡SOBREVIVISTE LA TORMENTA!' : `RAMITAS: ${score}/${levels[1].goal}`, 'PRESIONA PARA JUGAR']);
      }

      function loop() { update(); draw(); requestAnimationFrame(loop); }
      window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); jump(); }
        else if (state === 'gameover') jump();
      });
      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        jump();
      });
      loop();
    })();
  </script>
</body>
</html>
