<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly or Die</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      background: #10251c; font-family: "Courier New", monospace; overflow: hidden;
    }
    .cabinet {
      width: min(94vw, 540px, calc((100dvh - 72px) * .75));
    }
    canvas {
      display: block; width: 100%; height: auto; image-rendering: pixelated;
      border: 5px solid #d8bd67; box-shadow: 0 0 0 5px #315642, 0 0 35px #8fcf8a;
      background: #9ed6dc; touch-action: none; cursor: pointer;
    }
    .hint { margin: 16px 0 0; text-align: center; color: #b8d9ad; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 480px), (max-height: 520px) {
      .cabinet { width: min(94vw, calc((100dvh - 62px) * .75)); }
      .hint { margin-top: 12px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Juego Fly or Die, niveles El bosque tranquilo, La tormenta, Noche a ciegas y El volcán">
    <canvas id="game" width="480" height="640" aria-label="Fly or Die. Usa espacio para jugar."></canvas>
    <p class="hint">[ ESPACIO O TOCA LA PANTALLA ] IMPULSO</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const groundH = 54;
      const player = { x: 112, y: H / 2, size: 23, velocity: 0 };
      const physics = { gravity: 0.29, flap: -5.45, speed: 1.9 };
      const levels = [
        { name: 'EL BOSQUE TRANQUILO', short: 'BOSQUE', goal: 10, minGap: 188, maxGap: 202, speed: 1.9, storm: false, night: false },
        { name: 'LA TORMENTA', short: 'TORMENTA', goal: 20, minGap: 172, maxGap: 190, speed: 2.08, storm: true, night: false },
        { name: 'NOCHE A CIEGAS', short: 'NOCHE', goal: 30, minGap: 160, maxGap: 176, speed: 2.12, gravity: .31, flap: -5.55, storm: false, night: true },
        { name: 'EL VOLCÁN', short: 'VOLCÁN', goal: 40, minGap: 196, maxGap: 218, speed: 2.2, gravity: .31, flap: -5.55, storm: false, night: false, volcano: true }
      ];
      const wind = { active: false, force: 0, endsAt: 0, nextAt: 420, direction: 0 };
      const volcano = { active: false, startedAt: 0, endsAt: 0, nextAt: 260, shake: 0, pulse: 0 };
      let obstacles = [], leaves = [], rocks = [], score = 0, frame = 0, nightStartFrame = 0, state = 'start', best = 0, musicStarted = false, volcanoSpawnPillar = false;

      try { best = Number(localStorage.getItem('skyJumperBest')) || 0; } catch (_) {}

      function reset() {
        player.y = H / 2 - 30;
        player.velocity = 0;
        obstacles = [];
        leaves = [];
        rocks = [];
        score = 0;
        frame = 0;
        nightStartFrame = 0;
        wind.active = false;
        wind.force = 0;
        wind.endsAt = 0;
        wind.nextAt = 420;
        wind.direction = 0;
        volcano.active = false;
        volcano.shake = 0;
        volcano.pulse = 0;
        volcano.nextAt = 260;
        volcanoSpawnPillar = false;
        state = 'playing';
      }

      function jump() {
        if (state !== 'playing') { reset(); }
        startForestMusic();
        player.velocity = currentLevel().flap || physics.flap;
      }

      function addObstacle() {
        const level = currentLevel();
        // A wide, almost constant opening makes this first lesson forgiving.
        const gap = level.minGap + Math.random() * (level.maxGap - level.minGap);
        const minTop = 72;
        const maxTop = H - groundH - gap - 60;
        const top = minTop + Math.random() * (maxTop - minTop);
        const branchOffset = level.storm ? (Math.random() < .5 ? -1 : 1) * (18 + Math.random() * 20) : 0;
        const shiftOffset = level.volcano ? (Math.random() < .5 ? -1 : 1) * (24 + Math.random() * 26) : 0;
        const burning = level.volcano && Math.random() < .35;
        obstacles.push({
          x: W + 20,
          width: 56,
          top,
          baseTop: top,
          gap,
          swaySeed: Math.random() * Math.PI * 2,
          shiftOffset,
          branch: { collected: false, offset: branchOffset, burning }
        });
      }

      function gameOver(won = false) {
        state = won ? 'won' : 'gameover';
        if (score > best) {
          best = score;
          try { localStorage.setItem('skyJumperBest', best); } catch (_) {}
        }
      }

      // A small, gentle two-note loop; it starts only after a player gesture.
      function startForestMusic() {
        if (musicStarted) return;
        musicStarted = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const audio = new AudioContext();
        const notes = [261.63, 329.63, 392, 329.63];
        let note = 0;
        setInterval(() => {
          if (state !== 'playing') return;
          const osc = audio.createOscillator(), gain = audio.createGain();
          osc.type = 'sine'; osc.frequency.value = notes[note++ % notes.length];
          gain.gain.setValueAtTime(.025, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .55);
          osc.connect(gain).connect(audio.destination);
          osc.start(); osc.stop(audio.currentTime + .58);
        }, 700);
      }

      function currentLevel() {
        return levels.find(level => score < level.goal) || levels[levels.length - 1];
      }

      function enterLevel() {
        obstacles = [];
        leaves = [];
        rocks = [];
        wind.active = false;
        wind.force = 0;
        volcano.active = false;
        volcano.shake = 0;
        volcano.pulse = 0;
        volcano.nextAt = frame + 200 + Math.floor(Math.random() * 80);
        volcanoSpawnPillar = false;
        if (currentLevel().night) nightStartFrame = frame;
      }

      function updateWind(level) {
        if (!level.storm) {
          wind.active = false;
          wind.force = 0;
          leaves = [];
          return;
        }
        if (!wind.active && frame >= wind.nextAt) {
          wind.active = true;
          wind.direction = Math.random() < .5 ? -1 : 1;
          wind.force = wind.direction * (0.075 + Math.random() * 0.035);
          wind.endsAt = frame + 118;
        }
        if (wind.active && frame >= wind.endsAt) {
          wind.active = false;
          wind.force = 0;
          wind.nextAt = frame + 150 + Math.floor(Math.random() * 115);
        }
        if (wind.active && frame % 5 === 0) {
          leaves.push({
            x: W + 12,
            y: 74 + Math.random() * (H - groundH - 120),
            vx: -2.7 - Math.random() * 1.5,
            vy: wind.direction * (1 + Math.random() * 1.4),
            size: 4 + Math.random() * 4,
            spin: Math.random() * 8
          });
        }
        for (const leaf of leaves) {
          leaf.x += leaf.vx;
          leaf.y += leaf.vy + Math.sin((frame + leaf.spin) * .18) * .45;
        }
        leaves = leaves.filter(leaf => leaf.x > -18 && leaf.y > 28 && leaf.y < H - groundH + 12);
      }

      // Every so often the ground shakes: nearby columns lurch sideways and
      // the player has a brief window to react before they settle back.
      function updateVolcano(level) {
        if (!level.volcano) {
          volcano.active = false;
          volcano.shake = 0;
          volcano.pulse = 0;
          return;
        }
        if (!volcano.active && frame >= volcano.nextAt) {
          volcano.active = true;
          volcano.startedAt = frame;
          volcano.endsAt = frame + 70;
          obstacles.forEach(o => {
            o.shiftOffset = (Math.random() < .5 ? -1 : 1) * (24 + Math.random() * 26);
          });
        }
        if (volcano.active) {
          volcano.pulse = Math.sin(((frame - volcano.startedAt) / (volcano.endsAt - volcano.startedAt)) * Math.PI);
          volcano.shake = volcano.pulse * 6;
          if (frame >= volcano.endsAt) {
            volcano.active = false;
            volcano.shake = 0;
            volcano.pulse = 0;
            volcano.nextAt = frame + 260 + Math.floor(Math.random() * 200);
          }
        } else {
          volcano.pulse = 0;
        }
      }

      // A long single-sided rock, jutting from the ceiling or the floor.
      // It scrolls in exactly like a pipe, so the same read-and-react timing
      // the player already knows applies — no twig to collect on it.
      function addRockPillar() {
        const fromTop = Math.random() < .5;
        const baseLength = 260 + Math.random() * 140;
        // Materializes mid-screen instead of sliding in from the edge, but
        // stays harmless while it "forms" so there's still time to react.
        rocks.push({
          x: player.x + 260 + Math.random() * 160,
          width: 64,
          fromTop,
          baseLength,
          length: baseLength,
          pulseSeed: Math.random() * Math.PI * 2,
          solidAt: frame + 46
        });
      }

      function update() {
        if (state !== 'playing') return;
        frame++;
        const level = currentLevel();
        updateWind(level);
        updateVolcano(level);
        if (level.volcano) {
          if (frame % 160 === 0) {
            if (volcanoSpawnPillar) addRockPillar(); else addObstacle();
            volcanoSpawnPillar = !volcanoSpawnPillar;
          }
        } else if (frame % (level.night ? 98 : 112) === 0) {
          addObstacle();
        }
        player.velocity += level.gravity || physics.gravity;
        if (level.storm && wind.active) player.velocity += wind.force;
        player.y += player.velocity;

        const px = player.x, py = player.y, ps = player.size;
        if (py < 0 || py + ps > H - groundH) gameOver();
        for (const rock of rocks) {
          rock.x -= level.speed;
          // Grows and shrinks as it approaches, so the safe passage keeps changing.
          rock.length = rock.baseLength + Math.sin((frame + rock.pulseSeed) * .045) * 40;
          if (frame < rock.solidAt) continue;
          const overlapX = px + ps > rock.x && px < rock.x + rock.width;
          const blockTop = rock.fromTop ? 0 : H - groundH - rock.length;
          const blockBottom = rock.fromTop ? rock.length : H - groundH;
          const overlapY = py + ps > blockTop && py < blockBottom;
          if (overlapX && overlapY) gameOver();
        }
        rocks = rocks.filter(rock => rock.x + rock.width > -10);
        for (const o of obstacles) {
          o.x -= level.speed;
          if (level.storm) o.top = o.baseTop + Math.sin(frame * .035 + o.swaySeed) * 9;
          else if (level.volcano) o.top = o.baseTop + o.shiftOffset * volcano.pulse;
          const overlapX = px + ps > o.x && px < o.x + o.width;
          const inColumn = py < o.top || py + ps > o.top + o.gap;
          if (overlapX && inColumn) gameOver();
          const bx = o.x + o.width / 2, by = o.top + o.gap / 2 + o.branch.offset;
          const reachesBranch = !o.branch.collected && px + ps > bx - 15 && px < bx + 15 && py + ps > by - 11 && py < by + 11;
          if (reachesBranch) {
            o.branch.collected = true;
            if (o.branch.burning) {
              // Never drop back below the goal that unlocked this level.
              const levelIndex = levels.indexOf(level);
              const floor = levelIndex > 0 ? levels[levelIndex - 1].goal : 0;
              score = Math.max(floor, score - 1);
            } else {
              score++;
              if (score >= levels[levels.length - 1].goal) {
                gameOver(true);
              } else if (levels.some(level => score === level.goal)) {
                enterLevel();
                return;
              }
            }
          }
        }
        obstacles = obstacles.filter(o => o.x + o.width > -10);
      }

      function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
      function text(value, x, y, size, color = '#fff', align = 'left') {
        ctx.fillStyle = color; ctx.font = `bold ${size}px "Courier New", monospace`;
        ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(value, x, y);
      }

      function drawBackground() {
        const level = currentLevel();
        if (level.volcano) {
          rect(0, 0, W, H, '#2a0f0c');
          rect(0, 220, W, H - 220, '#160705');
          const glow = .55 + Math.sin(frame * .05) * .12 + volcano.shake * .02;
          ctx.fillStyle = `rgba(255,106,38,${Math.max(.2, glow)})`;
          ctx.fillRect(0, H - groundH - 70, W, 70);
        } else if (level.night) {
          rect(0, 0, W, H, '#10251f');
          rect(0, 250, W, H - 250, '#0b1b18');
        } else if (level.storm) {
          rect(0, 0, W, H, '#526b83');
          rect(0, 240, W, H - 240, '#4f7664');
          for (let y = 18; y < H - groundH; y += 31) {
            for (let x = -((frame * 4 + y) % 86); x < W; x += 86) rect(x, y, 22, 3, '#b9ccd1');
          }
        } else {
          rect(0, 0, W, H, '#9ed6dc');
          rect(0, 300, W, H - 300, '#76b876');
        }
        if (level.volcano) {
          // Jagged basalt spires with a glowing crack replace the treeline.
          for (let x = -20; x < W + 30; x += 54) {
            const h = 92 + ((x * 13) % 54);
            rect(x + 20, H - groundH - h, 12, h, '#241210');
            rect(x, H - groundH - h + 18, 52, 35, '#3a1a14');
            rect(x + 8, H - groundH - h, 37, 34, '#5a2618');
            rect(x + 16, H - groundH - h - 6, 6, 10, '#ff8a3d');
          }
          return;
        }
        // Soft layers of trees keep the forest calm and readable.
        for (let x = -20; x < W + 30; x += 54) {
          const h = 92 + ((x * 13) % 54);
          const trunk = level.night ? '#183d31' : level.storm ? '#3f5a4d' : '#547c4b';
          const leaves = level.night ? '#23513f' : level.storm ? '#456f57' : '#4e9358';
          rect(x + 20, H - groundH - h, 12, h, trunk);
          rect(x, H - groundH - h + 18, 52, 35, leaves);
          rect(x + 8, H - groundH - h, 37, 34, level.night ? '#2a6149' : level.storm ? '#537f63' : '#5ca963');
        }
      }

      function drawColumn(o) {
        const bottomY = o.top + o.gap;
        const level = currentLevel();
        const colors = level.volcano ? ['#4a2016', '#7a3a24', '#2a120c', '#ff8a3d'] : level.night ? ['#285e46', '#448668', '#173d31', '#78a957'] : ['#5a9d52', '#8acb70', '#397340', '#b6da6a'];
        rect(o.x, 0, o.width, o.top, colors[0]);
        rect(o.x + 6, 0, 9, o.top, colors[1]);
        rect(o.x + o.width - 7, 0, 7, o.top, colors[2]);
        rect(o.x - 5, o.top - 15, o.width + 10, 15, colors[3]);
        rect(o.x, bottomY, o.width, H - groundH - bottomY, colors[0]);
        rect(o.x + 6, bottomY, 9, H - groundH - bottomY, colors[1]);
        rect(o.x + o.width - 7, bottomY, 7, H - groundH - bottomY, colors[2]);
        rect(o.x - 5, bottomY, o.width + 10, 15, colors[3]);
        if (!o.branch.collected) drawBranch(o.x + o.width / 2, o.top + o.gap / 2 + o.branch.offset, false, o.branch.burning);
      }

      function drawBranch(x, y, glowOnly = false, burning = false) {
        if (burning) {
          if (glowOnly) return;
          // Pulsing scale + flickering colors + a soft halo make burning
          // twigs read as dangerous even against the orange volcano backdrop.
          const pulse = 1 + Math.sin(frame * .25) * .2;
          const flicker = Math.sin(frame * .4) > 0;
          const halo = ctx.createRadialGradient(x, y, 2, x, y, 24 * pulse);
          halo.addColorStop(0, 'rgba(255,222,140,.75)');
          halo.addColorStop(1, 'rgba(255,90,40,0)');
          ctx.fillStyle = halo;
          ctx.beginPath(); ctx.arc(x, y, 24 * pulse, 0, Math.PI * 2); ctx.fill();
          rect(x - 14, y - 2, 28, 5, '#241008');
          rect(x - 6, y - 8, 5, 13, '#241008');
          rect(x + 5, y - 5, 5, 10, '#241008');
          const core = flicker ? '#ffe38a' : '#ffb35e';
          rect(x - 11 * pulse, y - 12 * pulse, 8 * pulse, 7 * pulse, '#ff5b2e');
          rect(x + 4 * pulse, y - 13 * pulse, 9 * pulse, 7 * pulse, '#ff5b2e');
          rect(x - 8 * pulse, y - 9 * pulse, 5 * pulse, 5 * pulse, core);
          rect(x + 6 * pulse, y - 10 * pulse, 5 * pulse, 5 * pulse, core);
          const emberY = y - 16 - ((frame * 1.3) % 22);
          rect(x - 2, emberY, 2, 2, '#ffd25e');
          rect(x + 4, emberY - 6, 2, 2, '#ff8a3d');
          return;
        }
        if (!glowOnly) {
          rect(x - 14, y - 2, 28, 5, '#75492d');
          rect(x - 6, y - 8, 5, 13, '#75492d');
          rect(x + 5, y - 5, 5, 10, '#75492d');
        }
        const leaf = currentLevel().night ? '#e0e886' : '#9dcb55';
        rect(x - 10, y - 8, 7, 5, leaf);
        rect(x + 5, y - 9, 8, 5, leaf);
        if (currentLevel().night) {
          rect(x - 7, y - 6, 4, 3, '#fbffc0');
          rect(x + 7, y - 7, 4, 3, '#fbffc0');
        }
      }

      function drawRocks() {
        const colors = ['#4a2016', '#7a3a24', '#2a120c', '#ff8a3d'];
        for (const rock of rocks) {
          const y = rock.fromTop ? 0 : H - groundH - rock.length;
          if (frame < rock.solidAt) {
            // Shimmering silhouette while it coalesces out of ash — visible
            // and readable, but harmless until it solidifies.
            const alpha = 0.28 + Math.abs(Math.sin(frame * .3)) * 0.35;
            ctx.fillStyle = `rgba(255,138,61,${alpha})`;
            ctx.fillRect(Math.round(rock.x), Math.round(y), Math.round(rock.width), Math.round(rock.length));
            continue;
          }
          rect(rock.x, y, rock.width, rock.length, colors[0]);
          rect(rock.x + 6, y, 9, rock.length, colors[1]);
          rect(rock.x + rock.width - 7, y, 7, rock.length, colors[2]);
          const edgeY = rock.fromTop ? rock.length - 15 : y;
          rect(rock.x - 5, edgeY, rock.width + 10, 15, colors[3]);
        }
      }

      function drawPlayer() {
        const x = player.x, y = player.y;
        // Tiny flame trail reinforces the upward motion.
        if (state === 'playing' && player.velocity < -1) {
          rect(x - 7, y + 10, 7, 5, '#ffbc4a'); rect(x - 11, y + 11, 5, 3, '#f45b69');
        }
        rect(x, y, player.size, player.size, '#f3c85b');
        rect(x + 3, y + 3, player.size - 6, player.size - 6, '#e99645');
        rect(x + 14, y + 6, 5, 5, '#172b2c');
        rect(x + 16, y + 6, 2, 2, '#ffffff');
        rect(x + 4, y + player.size, 5, 4, '#f6e35b');
      }

      function drawGround() {
        const level = currentLevel();
        const ground = level.volcano ? '#1c0d0a' : level.night ? '#173d31' : level.storm ? '#2f5748' : '#3c7042';
        const grass = level.volcano ? '#ff8a3d' : level.night ? '#769c56' : level.storm ? '#8fbf7a' : '#b4d568';
        const tiles = level.volcano ? '#3a1a12' : level.night ? '#285941' : level.storm ? '#496f50' : '#5e914d';
        rect(0, H - groundH, W, groundH, ground);
        rect(0, H - groundH, W, 8, grass);
        for (let x = -((frame * 2) % 24); x < W; x += 24) {
          rect(x, H - 31, 13, 5, tiles); rect(x + 5, H - 17, 13, 5, tiles);
        }
      }

      function drawLeaves() {
        for (const leaf of leaves) {
          rect(leaf.x, leaf.y, leaf.size + 3, 3, '#d3aa4d');
          rect(leaf.x + 2, leaf.y - 2, leaf.size, 2, '#8daa53');
        }
      }

      function drawWindSignal() {
        const level = currentLevel();
        if (!level.storm || !wind.active) return;
        const y = wind.direction < 0 ? 84 : 126;
        const label = wind.direction < 0 ? 'VIENTO SUBE' : 'VIENTO BAJA';
        rect(W - 164, y - 18, 146, 34, '#223747');
        text(label, W - 91, y, 13, '#f2d477', 'center');
        const arrowY = y + (wind.direction < 0 ? -8 : 8);
        rect(W - 34, arrowY - 8, 5, 16, '#f2d477');
        rect(W - 39, arrowY + (wind.direction < 0 ? -10 : 6), 15, 5, '#f2d477');
      }

      function drawEruptionWarning() {
        if (!currentLevel().volcano || !volcano.active) return;
        rect(W / 2 - 82, 76, 164, 34, '#3a1208');
        text('¡TEMBLOR!', W / 2, 93, 15, '#ffb35e', 'center');
      }

      function nightFrame() { return frame - nightStartFrame; }

      function fireflies() {
        const cycle = nightFrame() % 580;
        if (!currentLevel().night || state !== 'playing' || cycle < 145 || cycle > 295) return [];
        const fade = Math.min(1, (cycle - 145) / 24, (295 - cycle) / 24);
        const drift = (cycle - 145) * .16;
        return [
          { x: 285 + Math.sin(drift) * 22, y: 230 + Math.cos(drift * .8) * 34, fade },
          { x: 350 + Math.sin(drift * .7 + 2) * 28, y: 365 + Math.cos(drift) * 30, fade },
          { x: 416 + Math.sin(drift * .9 + 1) * 19, y: 185 + Math.cos(drift * .6) * 36, fade }
        ];
      }

      function isBlackout() {
        const cycle = nightFrame() % 900;
        return currentLevel().night && state === 'playing' && cycle >= 675 && cycle < 755;
      }

      function clearLight(x, y, radius, strength = 1) {
        const light = ctx.createRadialGradient(x, y, radius * .2, x, y, radius);
        light.addColorStop(0, `rgba(0,0,0,${strength})`);
        light.addColorStop(.65, `rgba(0,0,0,${strength * .72})`);
        light.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = light;
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      }

      function drawFog(flies) {
        if (!currentLevel().night) return;
        ctx.save();
        ctx.fillStyle = isBlackout() ? 'rgba(0,4,5,.97)' : 'rgba(1,10,9,.88)';
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'destination-out';
        clearLight(player.x + player.size / 2, player.y + player.size / 2, isBlackout() ? 42 : 108);
        flies.forEach(fly => clearLight(fly.x, fly.y, 150, fly.fade));
        ctx.restore();
      }

      function drawFireflies(flies) {
        flies.forEach(fly => {
          const pulse = 2 + Math.sin(frame * .22 + fly.x) * .7;
          rect(fly.x - pulse, fly.y - pulse, pulse * 2, pulse * 2, '#d8ff71');
          rect(fly.x - 1, fly.y - 1, 2, 2, '#fff');
        });
      }

      function panel(title, lines) {
        rect(35, 206, W - 70, 168, '#173d31');
        ctx.strokeStyle = '#b4d568'; ctx.lineWidth = 4; ctx.strokeRect(37, 208, W - 74, 164);
        text(title, W / 2, 252, 24, '#f2d477', 'center');
        lines.forEach((line, i) => text(line, W / 2, 298 + i * 28, 15, '#ffffff', 'center'));
      }

      function draw() {
        const shake = volcano.active ? volcano.shake * (Math.random() < .5 ? -1 : 1) : 0;
        ctx.save();
        ctx.translate(shake, 0);
        drawBackground();
        drawLeaves();
        obstacles.forEach(drawColumn);
        drawRocks();
        drawGround();
        const flies = fireflies();
        drawFog(flies);
        if (currentLevel().night) {
          obstacles.forEach(o => {
            if (!o.branch.collected) drawBranch(o.x + o.width / 2, o.top + o.gap / 2 + o.branch.offset, true);
          });
        }
        drawFireflies(flies);
        drawPlayer();
        ctx.restore();
        drawWindSignal();
        drawEruptionWarning();
        const level = currentLevel();
        const levelNumber = String(levels.indexOf(level) + 1);
        const hudColor = level.volcano ? '#ffd8a8' : level.night ? '#d2e09a' : level.storm ? '#edf4d7' : '#285340';
        text(`NIVEL ${levelNumber} · ${level.short}`, 18, 29, 16, hudColor);
        text(`RAMITAS ${score}/${levels[levels.length - 1].goal}`, W - 18, 30, 17, hudColor, 'right');
        if (isBlackout()) text('¡A OSCURAS!', W / 2, 60, 15, '#f2df80', 'center');
        if (state === 'start') panel('EL BOSQUE TRANQUILO', ['RECOGE LAS RAMITAS', 'EN EL CENTRO DEL HUECO']);
        if (state === 'gameover') panel('INTÉNTALO DE NUEVO', [`RAMITAS: ${score}/${levels[levels.length - 1].goal}`, 'PRESIONA PARA JUGAR']);
        if (state === 'won') panel('¡JUEGO SUPERADO!', ['¡DOMINASTE LA OSCURIDAD!', 'PRESIONA PARA JUGAR']);
      }

      function loop() { update(); draw(); requestAnimationFrame(loop); }
      window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); jump(); }
        else if (state === 'gameover') jump();
        else if (e.key === '4') {
          // Debug shortcut: jump straight to the volcano level for testing.
          if (state !== 'playing') reset();
          score = levels[2].goal;
          enterLevel();
        }
      });
      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        jump();
      });
      loop();
    })();
  </script>
</body>
</html>
