<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly or Die</title>
  <style>
    :root { color-scheme: dark; } * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #10251c; font-family: "Courier New", monospace; overflow: hidden; }
    .cabinet { width: min(94vw, 540px, calc((100dvh - 72px) * .75)); }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 5px solid #d8bd67; box-shadow: 0 0 0 5px #315642, 0 0 35px #8fcf8a; background: #9ed6dc; touch-action: none; cursor: pointer; }
    .hint { margin: 16px 0 0; text-align: center; color: #b8d9ad; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 480px), (max-height: 520px) { .cabinet { width: min(94vw, calc((100dvh - 62px) * .75)); } .hint { margin-top: 12px; font-size: 10px; } }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Juego Fly or Die">
    <canvas id="game" width="480" height="640" aria-label="Fly or Die. Usa espacio para jugar."></canvas>
    <p class="hint">[ ESPACIO O TOCA LA PANTALLA ] IMPULSO</p>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height, groundH = 54;
      const player = { x: 112, y: H / 2, size: 23, velocity: 0 };
      const levels = {
        1: { name: 'EL BOSQUE TRANQUILO', short: 'BOSQUE', goal: 10, minGap: 188, maxGap: 202, gravity: .29, flap: -5.45, speed: 1.9 },
        3: { name: 'NOCHE A CIEGAS', short: 'NOCHE', goal: 15, minGap: 160, maxGap: 176, gravity: .31, flap: -5.55, speed: 2.12 }
      };
      let currentLevel = 1, state = 'select', obstacles = [], score = 0, frame = 0;
      let best = { 1: 0, 3: 0 };
      try { best = { 1: Number(localStorage.getItem('flyOrDieForestBest')) || 0, 3: Number(localStorage.getItem('flyOrDieNightBest')) || 0 }; } catch (_) {}
      const level = () => levels[currentLevel], isNight = () => currentLevel === 3;

      function reset() { player.y = H / 2 - 30; player.velocity = 0; obstacles = []; score = 0; frame = 0; state = 'playing'; }
      function jump() { if (state !== 'playing') reset(); player.velocity = level().flap; }
      function addObstacle() {
        const config = level(), gap = config.minGap + Math.random() * (config.maxGap - config.minGap);
        obstacles.push({ x: W + 20, width: 58, top: 70 + Math.random() * (H - groundH - gap - 130), gap, branch: { collected: false } });
      }
      function finish(won) {
        state = won ? 'won' : 'gameover';
        if (score > best[currentLevel]) {
          best[currentLevel] = score;
          try { localStorage.setItem(isNight() ? 'flyOrDieNightBest' : 'flyOrDieForestBest', score); } catch (_) {}
        }
      }
      function update() {
        if (state !== 'playing') return;
        frame++; player.velocity += level().gravity; player.y += player.velocity;
        if (frame % (isNight() ? 98 : 112) === 0) addObstacle();
        const px = player.x, py = player.y, ps = player.size;
        if (py < 0 || py + ps > H - groundH) finish(false);
        for (const o of obstacles) {
          o.x -= level().speed + (isNight() ? Math.min(score * .02, .35) : 0);
          if (px + ps > o.x && px < o.x + o.width && (py < o.top || py + ps > o.top + o.gap)) finish(false);
          const bx = o.x + o.width / 2, by = o.top + o.gap / 2;
          if (!o.branch.collected && px + ps > bx - 17 && px < bx + 17 && py + ps > by - 13 && py < by + 13) {
            o.branch.collected = true; score++;
            if (score >= level().goal) finish(true);
          }
        }
        obstacles = obstacles.filter(o => o.x + o.width > -10);
      }
      function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
      function text(value, x, y, size, color = '#fff', align = 'left') { ctx.fillStyle = color; ctx.font = `bold ${size}px "Courier New", monospace`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(value, x, y); }
      function drawBackground() {
        if (isNight()) {
          rect(0, 0, W, H, '#10251f'); rect(0, 250, W, H - 250, '#0b1b18');
          for (let x = -28; x < W + 30; x += 54) { const h = 104 + ((x * 17) % 52); rect(x + 20, H - groundH - h, 13, h, '#183d31'); rect(x, H - groundH - h + 24, 53, 38, '#23513f'); rect(x + 8, H - groundH - h, 38, 37, '#2a6149'); }
        } else {
          rect(0, 0, W, H, '#9ed6dc'); rect(0, 300, W, H - 300, '#76b876');
          for (let x = -20; x < W + 30; x += 54) { const h = 92 + ((x * 13) % 54); rect(x + 20, H - groundH - h, 12, h, '#547c4b'); rect(x, H - groundH - h + 18, 52, 35, '#4e9358'); rect(x + 8, H - groundH - h, 37, 34, '#5ca963'); }
        }
      }
      function drawColumn(o) {
        const bottom = o.top + o.gap, c = isNight() ? ['#285e46','#448668','#173d31','#78a957'] : ['#5a9d52','#8acb70','#397340','#b6da6a'];
        [[0, o.top], [bottom, H - groundH - bottom]].forEach(([y, h]) => { rect(o.x, y, o.width, h, c[0]); rect(o.x + 7, y, 9, h, c[1]); rect(o.x + o.width - 7, y, 7, h, c[2]); });
        rect(o.x - 5, o.top - 14, o.width + 10, 14, c[3]); rect(o.x - 5, bottom, o.width + 10, 14, c[3]);
      }
      function drawBranch(x, y, glowOnly = false) {
        if (!glowOnly) { rect(x - 14, y - 2, 28, 5, '#75492d'); rect(x - 6, y - 8, 5, 13, '#75492d'); rect(x + 5, y - 5, 5, 10, '#75492d'); }
        const leaf = isNight() ? '#e0e886' : '#9dcb55'; rect(x - 10, y - 8, 7, 5, leaf); rect(x + 5, y - 9, 8, 5, leaf);
        if (isNight()) { rect(x - 7, y - 6, 4, 3, '#fbffc0'); rect(x + 7, y - 7, 4, 3, '#fbffc0'); }
      }
      function drawGround() {
        const c = isNight() ? ['#173d31','#769c56','#285941'] : ['#3c7042','#b4d568','#5e914d'];
        rect(0, H - groundH, W, groundH, c[0]); rect(0, H - groundH, W, 8, c[1]);
        for (let x = -((frame * 2) % 24); x < W; x += 24) { rect(x, H - 31, 13, 5, c[2]); rect(x + 5, H - 17, 13, 5, c[2]); }
      }
      function fireflies() {
        const cycle = frame % 580;
        if (!isNight() || state !== 'playing' || cycle < 145 || cycle > 295) return [];
        const fade = Math.min(1, (cycle - 145) / 24, (295 - cycle) / 24), drift = (cycle - 145) * .16;
        return [[285 + Math.sin(drift) * 22, 230 + Math.cos(drift * .8) * 34], [350 + Math.sin(drift * .7 + 2) * 28, 365 + Math.cos(drift) * 30], [416 + Math.sin(drift * .9 + 1) * 19, 185 + Math.cos(drift * .6) * 36]].map(([x, y]) => ({ x, y, fade }));
      }
      function clearLight(x, y, radius, strength = 1) {
        const light = ctx.createRadialGradient(x, y, radius * .2, x, y, radius);
        light.addColorStop(0, `rgba(0,0,0,${strength})`); light.addColorStop(.65, `rgba(0,0,0,${strength * .72})`); light.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = light; ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      }
      function isBlackout() { const cycle = frame % 900; return isNight() && state === 'playing' && cycle >= 675 && cycle < 755; }
      function drawFog(flies) {
        if (!isNight()) return;
        ctx.save(); ctx.fillStyle = isBlackout() ? 'rgba(0,4,5,.97)' : 'rgba(1,10,9,.88)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'destination-out';
        clearLight(player.x + player.size / 2, player.y + player.size / 2, isBlackout() ? 42 : 108); flies.forEach(fly => clearLight(fly.x, fly.y, 150, fly.fade)); ctx.restore();
      }
      function drawFireflies(flies) { flies.forEach(fly => { const p = 2 + Math.sin(frame * .22 + fly.x) * .7; rect(fly.x - p, fly.y - p, p * 2, p * 2, '#d8ff71'); rect(fly.x - 1, fly.y - 1, 2, 2, '#fff'); }); }
      function drawPlayer() {
        const x = player.x, y = player.y;
        if (state === 'playing' && player.velocity < -1) { rect(x - 7, y + 10, 7, 5, '#ffbc4a'); rect(x - 11, y + 11, 5, 3, '#f45b69'); }
        rect(x, y, player.size, player.size, isNight() ? '#f4cd64' : '#f3c85b'); rect(x + 3, y + 3, player.size - 6, player.size - 6, isNight() ? '#d98742' : '#e99645'); rect(x + 14, y + 6, 5, 5, '#172b2c'); rect(x + 16, y + 6, 2, 2, '#fff'); rect(x + 4, y + player.size, 5, 4, '#f6e35b');
      }
      function panel(title, lines) {
        rect(31, 194, W - 62, 202, isNight() ? '#092019' : '#173d31'); ctx.strokeStyle = '#c9d66e'; ctx.lineWidth = 4; ctx.strokeRect(33, 196, W - 66, 198);
        text(title, W / 2, 236, 23, '#f3d671', 'center'); lines.forEach((line, i) => text(line, W / 2, 282 + i * 26, 14, '#fff', 'center'));
      }
      function draw() {
        drawBackground(); obstacles.forEach(drawColumn); obstacles.forEach(o => !o.branch.collected && drawBranch(o.x + o.width / 2, o.top + o.gap / 2)); drawGround();
        const flies = fireflies(); drawFog(flies); if (isNight()) obstacles.forEach(o => !o.branch.collected && drawBranch(o.x + o.width / 2, o.top + o.gap / 2, true));
        drawFireflies(flies); drawPlayer();
        const ink = isNight() ? '#d2e09a' : '#285340'; text(`NIVEL ${currentLevel} · ${level().short}`, 18, 29, 16, ink); text(`RAMITAS ${score}/${level().goal}`, W - 18, 30, 16, ink, 'right');
        if (isBlackout()) text('¡A OSCURAS!', W / 2, 60, 15, '#f2df80', 'center');
        if (state === 'select') panel('FLY OR DIE', ['[1] EL BOSQUE TRANQUILO', '[3] NOCHE A CIEGAS', 'USA 1 O 3 Y PRESIONA ESPACIO']);
        if (state === 'gameover') panel(isNight() ? 'LA NOCHE TE ALCANZÓ' : 'INTÉNTALO DE NUEVO', [`RAMITAS: ${score}/${level().goal}`, `RÉCORD: ${best[currentLevel]}`, 'PRESIONA PARA INTENTARLO']);
        if (state === 'won') panel('¡NIVEL SUPERADO!', [`¡${level().goal} RAMITAS RECOGIDAS!`, isNight() ? 'DOMINASTE LA OSCURIDAD' : 'EL BOSQUE ESTÁ A SALVO', 'PRESIONA PARA JUGAR']);
      }
      function loop() { update(); draw(); requestAnimationFrame(loop); }
      window.addEventListener('keydown', event => {
        if (event.code === 'Digit1' && state === 'select') { currentLevel = 1; return; }
        if (event.code === 'Digit3' && state === 'select') { currentLevel = 3; return; }
        if (event.code === 'Space') { event.preventDefault(); jump(); } else if (state === 'gameover' || state === 'won') jump();
      });
      canvas.addEventListener('pointerdown', event => {
        event.preventDefault();
        if (state === 'select') {
          const bounds = canvas.getBoundingClientRect();
          const y = (event.clientY - bounds.top) * H / bounds.height;
          currentLevel = y >= 295 && y <= 325 ? 3 : 1;
        }
        jump();
      });
      loop();
    })();
  </script>
</body>
</html>
