<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fly or Die · Nivel 3</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      background: #03080b; font-family: "Courier New", monospace; overflow: hidden;
    }
    .cabinet { width: min(94vw, 540px, calc((100dvh - 72px) * .75)); }
    canvas {
      display: block; width: 100%; height: auto; image-rendering: pixelated;
      border: 5px solid #d7b75b; box-shadow: 0 0 0 5px #183a38, 0 0 35px #74d89c;
      background: #071613; touch-action: none; cursor: pointer;
    }
    .hint { margin: 16px 0 0; text-align: center; color: #9dc9ad; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 480px), (max-height: 520px) {
      .cabinet { width: min(94vw, calc((100dvh - 62px) * .75)); }
      .hint { margin-top: 12px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="cabinet" aria-label="Fly or Die, nivel 3: bosque nocturno">
    <canvas id="game" width="480" height="640" aria-label="Fly or Die. Usa espacio para volar."></canvas>
    <p class="hint">[ ESPACIO O TOCA LA PANTALLA ] IMPULSO</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height, groundH = 54;
      const player = { x: 112, y: H / 2, size: 23, velocity: 0 };
      const physics = { gravity: .31, flap: -5.55, speed: 2.12 };
      const level = { name: 'NOCHE A CIEGAS', goal: 15, minGap: 160, maxGap: 176 };
      let obstacles = [], score = 0, frame = 0, state = 'start', best = 0;

      try { best = Number(localStorage.getItem('flyOrDieNightBest')) || 0; } catch (_) {}

      function reset() {
        player.y = H / 2 - 30;
        player.velocity = 0;
        obstacles = [];
        score = 0;
        frame = 0;
        state = 'playing';
      }

      function jump() {
        if (state !== 'playing') reset();
        player.velocity = physics.flap;
      }

      function addObstacle() {
        const gap = level.minGap + Math.random() * (level.maxGap - level.minGap);
        const minTop = 70, maxTop = H - groundH - gap - 60;
        obstacles.push({
          x: W + 20, width: 58, top: minTop + Math.random() * (maxTop - minTop), gap,
          branch: { collected: false }
        });
      }

      function finish(won) {
        state = won ? 'won' : 'gameover';
        if (score > best) {
          best = score;
          try { localStorage.setItem('flyOrDieNightBest', best); } catch (_) {}
        }
      }

      function update() {
        if (state !== 'playing') return;
        frame++;
        player.velocity += physics.gravity;
        player.y += player.velocity;
        if (frame % 98 === 0) addObstacle();

        const px = player.x, py = player.y, ps = player.size;
        if (py < 0 || py + ps > H - groundH) finish(false);

        for (const o of obstacles) {
          o.x -= physics.speed + Math.min(score * .02, .35);
          const overlapsColumn = px + ps > o.x && px < o.x + o.width;
          const outsideGap = py < o.top || py + ps > o.top + o.gap;
          if (overlapsColumn && outsideGap) finish(false);

          const bx = o.x + o.width / 2, by = o.top + o.gap / 2;
          const touchesBranch = !o.branch.collected && px + ps > bx - 17 && px < bx + 17 && py + ps > by - 13 && py < by + 13;
          if (touchesBranch) {
            o.branch.collected = true;
            score++;
            if (score >= level.goal) finish(true);
          }
        }
        obstacles = obstacles.filter(o => o.x + o.width > -10);
      }

      function rect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function text(value, x, y, size, color = '#fff', align = 'left') {
        ctx.fillStyle = color;
        ctx.font = `bold ${size}px "Courier New", monospace`;
        ctx.textAlign = align;
        ctx.textBaseline = 'middle';
        ctx.fillText(value, x, y);
      }

      function drawBackground() {
        rect(0, 0, W, H, '#10251f');
        rect(0, 250, W, H - 250, '#0b1b18');
        const stars = [[32,70],[84,132],[143,54],[216,106],[280,44],[348,121],[424,73],[458,196],[52,263],[185,213],[316,245]];
        for (const [x, y] of stars) rect(x, y, 3, 3, '#78a98e');
        for (let x = -28; x < W + 30; x += 54) {
          const treeH = 104 + ((x * 17) % 52);
          rect(x + 20, H - groundH - treeH, 13, treeH, '#183d31');
          rect(x, H - groundH - treeH + 24, 53, 38, '#23513f');
          rect(x + 8, H - groundH - treeH, 38, 37, '#2a6149');
        }
      }

      function drawColumn(o) {
        const bottomY = o.top + o.gap;
        rect(o.x, 0, o.width, o.top, '#285e46');
        rect(o.x + 7, 0, 9, o.top, '#448668');
        rect(o.x + o.width - 7, 0, 7, o.top, '#173d31');
        rect(o.x - 5, o.top - 14, o.width + 10, 14, '#78a957');
        rect(o.x, bottomY, o.width, H - groundH - bottomY, '#285e46');
        rect(o.x + 7, bottomY, 9, H - groundH - bottomY, '#448668');
        rect(o.x + o.width - 7, bottomY, 7, H - groundH - bottomY, '#173d31');
        rect(o.x - 5, bottomY, o.width + 10, 14, '#78a957');
      }

      function drawBranch(x, y, glowOnly = false) {
        if (!glowOnly) {
          rect(x - 14, y - 2, 28, 5, '#72452d');
          rect(x - 6, y - 8, 5, 13, '#72452d');
          rect(x + 5, y - 5, 5, 10, '#72452d');
        }
        rect(x - 10, y - 8, 7, 5, '#e0e886');
        rect(x + 5, y - 9, 8, 5, '#e0e886');
        rect(x - 7, y - 6, 4, 3, '#fbffc0');
        rect(x + 7, y - 7, 4, 3, '#fbffc0');
      }

      function drawGround() {
        rect(0, H - groundH, W, groundH, '#173d31');
        rect(0, H - groundH, W, 8, '#769c56');
        for (let x = -((frame * 2) % 24); x < W; x += 24) {
          rect(x, H - 31, 13, 5, '#285941');
          rect(x + 5, H - 17, 13, 5, '#285941');
        }
      }

      function fireflies() {
        const cycle = frame % 580;
        if (state !== 'playing' || cycle < 145 || cycle > 295) return [];
        const appear = Math.min(1, (cycle - 145) / 24, (295 - cycle) / 24);
        const drift = (cycle - 145) * .16;
        return [
          { x: 285 + Math.sin(drift) * 22, y: 230 + Math.cos(drift * .8) * 34, a: appear },
          { x: 350 + Math.sin(drift * .7 + 2) * 28, y: 365 + Math.cos(drift) * 30, a: appear },
          { x: 416 + Math.sin(drift * .9 + 1) * 19, y: 185 + Math.cos(drift * .6) * 36, a: appear }
        ];
      }

      function clearLight(x, y, radius, strength = 1) {
        const light = ctx.createRadialGradient(x, y, radius * .2, x, y, radius);
        light.addColorStop(0, `rgba(0,0,0,${strength})`);
        light.addColorStop(.65, `rgba(0,0,0,${strength * .72})`);
        light.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = light;
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      }

      function isBlackout() {
        const cycle = frame % 900;
        return state === 'playing' && cycle >= 675 && cycle < 755;
      }

      function drawFog(flies) {
        ctx.save();
        ctx.fillStyle = isBlackout() ? 'rgba(0, 4, 5, .97)' : 'rgba(1, 10, 9, .88)';
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'destination-out';
        clearLight(player.x + player.size / 2, player.y + player.size / 2, isBlackout() ? 42 : 108);
        for (const fly of flies) clearLight(fly.x, fly.y, 150, fly.a);
        ctx.restore();
      }

      function drawFireflies(flies) {
        for (const fly of flies) {
          const pulse = 2 + Math.sin(frame * .22 + fly.x) * .7;
          rect(fly.x - pulse, fly.y - pulse, pulse * 2, pulse * 2, '#d8ff71');
          rect(fly.x - 1, fly.y - 1, 2, 2, '#ffffff');
        }
      }

      function drawPlayer() {
        const x = player.x, y = player.y;
        if (state === 'playing' && player.velocity < -1) {
          rect(x - 7, y + 10, 7, 5, '#f8c95d');
          rect(x - 11, y + 11, 5, 3, '#e56d55');
        }
        rect(x, y, player.size, player.size, '#f4cd64');
        rect(x + 3, y + 3, player.size - 6, player.size - 6, '#d98742');
        rect(x + 14, y + 6, 5, 5, '#11251e');
        rect(x + 16, y + 6, 2, 2, '#ffffff');
        rect(x + 4, y + player.size, 5, 4, '#f4e678');
      }

      function panel(title, lines) {
        rect(31, 194, W - 62, 190, '#092019');
        ctx.strokeStyle = '#c9d66e'; ctx.lineWidth = 4;
        ctx.strokeRect(33, 196, W - 66, 186);
        text(title, W / 2, 238, 23, '#f3d671', 'center');
        lines.forEach((line, i) => text(line, W / 2, 286 + i * 26, 14, '#ffffff', 'center'));
      }

      function draw() {
        drawBackground();
        obstacles.forEach(drawColumn);
        for (const o of obstacles) if (!o.branch.collected) drawBranch(o.x + o.width / 2, o.top + o.gap / 2);
        drawGround();
        const flies = fireflies();
        drawFog(flies);
        // The collectibles remain faintly readable even at the edge of the darkness.
        for (const o of obstacles) if (!o.branch.collected) drawBranch(o.x + o.width / 2, o.top + o.gap / 2, true);
        drawFireflies(flies);
        drawPlayer();
        text('NIVEL 3 · NOCHE', 18, 29, 16, '#d2e09a');
        text(`RAMITAS ${score}/${level.goal}`, W - 18, 30, 16, '#d2e09a', 'right');
        if (isBlackout()) text('¡A OSCURAS!', W / 2, 60, 15, '#f2df80', 'center');
        if (state === 'start') panel('NOCHE A CIEGAS', ['RECOGE 15 RAMITAS', 'LAS LUCIÉRNAGAS TE GUÍAN', 'PRESIONA PARA VOLAR']);
        if (state === 'gameover') panel('LA NOCHE TE ALCANZÓ', [`RAMITAS: ${score}/${level.goal}`, `RÉCORD: ${best}`, 'PRESIONA PARA INTENTARLO']);
        if (state === 'won') panel('¡NIVEL SUPERADO!', ['¡15 RAMITAS RECOGIDAS!', 'DOMINASTE LA OSCURIDAD', 'PRESIONA PARA JUGAR']);
      }

      function loop() { update(); draw(); requestAnimationFrame(loop); }
      window.addEventListener('keydown', event => {
        if (event.code === 'Space') { event.preventDefault(); jump(); }
        else if (state === 'gameover' || state === 'won') jump();
      });
      canvas.addEventListener('pointerdown', event => { event.preventDefault(); jump(); });
      loop();
    })();
  </script>
</body>
</html>
